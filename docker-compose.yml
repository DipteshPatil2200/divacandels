services:
  mongodb:
    image: mongo:8
    container_name: diva-candles-mongodb
    environment:
      MONGO_INITDB_DATABASE: diva_candles
    ports:
      - "27017:27017"
    volumes:
      - diva_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  diva_mongo_data:
